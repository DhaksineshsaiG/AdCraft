services:
  - type: web
    name: adcraft-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      - key: POSTER_RENDERER_VERSION
        value: v2
      - key: CONTENT_PROVIDER
        value: marketing
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        value: aipostergenerator-storage-dhak
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: EMAIL_FROM_NAME
        value: PosterAI
      - key: EMAIL_FROM_ADDRESS
        value: posterai.support@gmail.com
      - key: EMAIL_REPLY_TO
        value: posterai.support@gmail.com
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "20"
      - key: CAMPAIGN_EXECUTION_AMOUNT
        value: "499"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
